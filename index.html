<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17212b">
  <title>Yusuf Mobilya Hesaplama</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f4f7; color: #17212b; }
    main { width: min(100% - 28px, 620px); margin: 0 auto; padding: 28px 0 48px; }
    header { margin-bottom: 20px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    header p { margin: 0; color: #5d6773; }
    .card { background: white; border-radius: 18px; padding: 20px; box-shadow: 0 8px 28px rgba(23,33,43,.08); }
    label { display: block; margin: 15px 0 7px; font-weight: 700; }
    input, select, button { width: 100%; min-height: 50px; border-radius: 12px; font: inherit; }
    input, select { border: 1px solid #c9d1d9; padding: 0 14px; background: white; font-size: 18px; }
    button { margin-top: 20px; border: 0; background: #17212b; color: white; font-weight: 800; font-size: 18px; }
    button:active { transform: scale(.99); }
    #error { color: #b42318; font-weight: 700; margin-top: 14px; }
    #result { margin-top: 18px; }
    .summary { padding: 14px; border-radius: 12px; background: #eef6ff; font-weight: 700; }
    .row { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: center; padding: 13px 0; border-bottom: 1px solid #e8ebef; }
    .badge { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: #17212b; color: white; font-weight: 800; }
    .measure { font-size: 17px; line-height: 1.55; }
    .muted { color: #66717e; font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Mobilya Delik Hesaplama</h1>
      <p>Yusuf Soybir — Tek Delik / Üçlü Delik</p>
    </header>
    <section class="card">
      <form id="calculator">
        <label for="height">İç yükseklik (cm)</label>
        <input id="height" name="height" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Örnek: 176.20" required>

        <label for="shelves">Raf sayısı</label>
        <input id="shelves" name="shelves" type="number" min="1" step="1" inputmode="numeric" placeholder="Örnek: 4" required>

        <label for="thickness">Raf kalınlığı (cm)</label>
        <input id="thickness" name="thickness" type="number" min="0.01" step="0.01" inputmode="decimal" value="1.90" required>

        <label for="pattern">Delik sistemi</label>
        <select id="pattern" name="pattern">
          <option value="single">Tek Delik</option>
          <option value="triple">Üçlü Delik (5 aşağı, 7 yukarı)</option>
        </select>

        <button type="submit">Hesapla</button>
      </form>
      <p id="error" role="alert" hidden></p>
      <div id="result" aria-live="polite" hidden>
        <div class="summary" id="summary"></div>
        <div id="rows"></div>
      </div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#calculator');
    const errorBox = document.querySelector('#error');
    const result = document.querySelector('#result');
    const summary = document.querySelector('#summary');
    const rows = document.querySelector('#rows');
    const format = (value) => value.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      result.hidden = true;

      const height = Number(form.height.value.replace(',', '.'));
      const shelfCount = Number(form.shelves.value);
      const thickness = Number(form.thickness.value.replace(',', '.'));
      const pattern = form.pattern.value;

      if (!Number.isFinite(height) || height <= 0 || !Number.isInteger(shelfCount) || shelfCount <= 0 ||
          !Number.isFinite(thickness) || thickness <= 0) {
        errorBox.textContent = 'Lütfen bütün ölçüleri doğru gir.';
        errorBox.hidden = false;
        return;
      }

      const clearGap = (height - shelfCount * thickness) / (shelfCount + 1);
      if (clearGap <= 0) {
        errorBox.textContent = 'Raflar bu yüksekliğe sığmıyor.';
        errorBox.hidden = false;
        return;
      }

      summary.textContent = `Net boşluk: ${format(clearGap)} cm`;
      rows.replaceChildren();

      for (let index = 0; index < shelfCount; index += 1) {
        const shelfNumber = index + 1;
        const centre = shelfNumber * clearGap + index * thickness;
        const row = document.createElement('div');
        row.className = 'row';

        const badge = document.createElement('div');
        badge.className = 'badge';
        badge.textContent = String(shelfNumber);

        const measure = document.createElement('div');
        measure.className = 'measure';
        if (pattern === 'triple') {
          measure.innerHTML = `Alt: <strong>${format(centre - 5)} cm</strong><br>Orta: <strong>${format(centre)} cm</strong><br>Üst: <strong>${format(centre + 7)} cm</strong>`;
        } else {
          measure.innerHTML = `Delik merkezi: <strong>${format(centre)} cm</strong>`;
        }

        row.append(badge, measure);
        rows.append(row);
      }

      const note = document.createElement('p');
      note.className = 'muted';
      note.textContent = 'Bütün ölçüler zeminden alınır.';
      rows.append(note);
      result.hidden = false;
    });
  </script>
</body>
</html>
