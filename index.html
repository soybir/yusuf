<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17212b">
  <meta name="description" content="Raf delikleri, dolap kesim listesi ve ön kenar bandını hesaplar.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317212b'/%3E%3Ccircle cx='20' cy='32' r='6' fill='%23fff'/%3E%3Ccircle cx='44' cy='22' r='5' fill='%23fff'/%3E%3Ccircle cx='44' cy='42' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <title>Yusuf Mobilya Hesaplama</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f4f7; color: #17212b; }
    main { width: min(100% - 28px, 620px); margin: 0 auto; padding: 24px 0 48px; }
    header { margin-bottom: 18px; }
    h1 { margin: 0 0 5px; font-size: 1.75rem; }
    header p { margin: 0; color: #5d6773; font-size: 1rem; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; padding: 5px; background: #dfe5eb; border-radius: 14px; }
    .tab { min-height: 44px; margin: 0; background: transparent; color: #33404d; font-size: .95rem; }
    .tab.active { background: #fff; color: #17212b; box-shadow: 0 2px 8px rgba(23,33,43,.12); }
    .card { background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 8px 28px rgba(23,33,43,.09); }
    label { display: block; margin: 15px 0 7px; font-weight: 750; font-size: 1rem; }
    input, select, button { width: 100%; min-height: 52px; border-radius: 12px; font: inherit; }
    input, select { border: 1px solid #c9d1d9; padding: 0 14px; background: #fff; font-size: 1.1rem; }
    button { margin-top: 20px; border: 0; background: #17212b; color: #fff; font-weight: 800; font-size: 1.1rem; }
    button:active { transform: scale(.99); }
    #error, #cabinet-error, #sheet-error { color: #b42318; font-weight: 700; margin-top: 14px; }
    #result { margin-top: 18px; }
    .summary { padding: 14px; border-radius: 12px; background: #eaf4ff; font-weight: 750; }
    .row { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: center; padding: 13px 0; border-bottom: 1px solid #e8ebef; }
    .badge { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: #17212b; color: #fff; font-weight: 800; }
    .measure { font-size: 1.05rem; line-height: 1.55; }
    .muted { color: #66717e; font-size: .9rem; }
    .rule { margin: 14px 0 0; padding: 12px; border-radius: 10px; background: #f2f4f7; color: #4f5b67; font-size: .9rem; line-height: 1.5; }
    .table-wrap { overflow-x: auto; margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th, td { padding: 11px 8px; border-bottom: 1px solid #e5e9ed; text-align: start; white-space: nowrap; }
    th { color: #5d6773; font-size: .85rem; }
    td:first-child { font-weight: 700; }
    .band-total { margin-top: 15px; padding: 14px; border-radius: 12px; background: #eef8ef; line-height: 1.55; }
    .sheet-settings { margin-top: 18px; padding-top: 18px; border-top: 2px solid #e5e9ed; }
    .sheet-settings h2 { margin: 0 0 4px; font-size: 1.2rem; }
    .sheet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
    .check-row { display: flex; align-items: center; gap: 10px; margin-top: 15px; font-weight: 700; }
    .check-row input { width: 23px; min-height: 23px; margin: 0; }
    .sheet-summary { margin: 17px 0 10px; padding: 14px; border-radius: 12px; background: #fff5df; line-height: 1.55; }
    .sheet-card { margin-top: 18px; }
    .sheet-title { margin: 0 0 8px; font-size: 1rem; }
    .sheet { position: relative; width: 100%; overflow: hidden; border: 2px solid #17212b; border-radius: 5px; background: repeating-linear-gradient(45deg, #f8eedb, #f8eedb 8px, #f5e8cf 8px, #f5e8cf 16px); }
    .piece { position: absolute; overflow: hidden; border: 1px solid rgba(23,33,43,.65); color: #17212b; font-size: .72rem; font-weight: 750; text-align: center; line-height: 1.15; }
    .piece-name { position: absolute; inset: 0; display: grid; place-items: center; padding: 13px 18px; overflow: hidden; }
    .edge-label { position: absolute; z-index: 2; padding: 1px 3px; border-radius: 3px; background: rgba(255,255,255,.82); font-size: .62rem; font-weight: 800; line-height: 1; white-space: nowrap; }
    .edge-top { top: 2px; left: 50%; transform: translateX(-50%); }
    .edge-side { top: 50%; right: 2px; transform: translate(42%, -50%) rotate(-90deg); transform-origin: center; }
    .piece:nth-child(4n+1) { background: rgba(105, 182, 255, .82); }
    .piece:nth-child(4n+2) { background: rgba(255, 190, 92, .84); }
    .piece:nth-child(4n+3) { background: rgba(129, 211, 160, .84); }
    .piece:nth-child(4n+4) { background: rgba(207, 162, 255, .82); }
    @media (max-width: 430px) { .sheet-grid { grid-template-columns: 1fr; } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Mobilya Delik Hesaplama</h1>
      <p>Delik ölçüsü ve kesim listesi</p>
    </header>
    <nav class="tabs" aria-label="Hesaplama türü">
      <button type="button" class="tab active" data-panel="hole-panel">Delik sistemi</button>
      <button type="button" class="tab" data-panel="cabinet-panel">Kesim listesi</button>
    </nav>
    <section class="card panel" id="hole-panel">
      <form id="hole-calculator">
        <label for="height">İç yükseklik (cm)</label>
        <input id="height" name="height" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Örnek: 176.20" required>
        <label for="shelves">Raf sayısı</label>
        <input id="shelves" name="shelves" type="number" min="1" step="1" inputmode="numeric" placeholder="Örnek: 4" required>
        <label for="thickness">Raf kalınlığı (cm)</label>
        <input id="thickness" name="thickness" type="number" min="0.01" step="0.01" inputmode="decimal" value="1.90" required>
        <label for="pattern">Delik sistemi</label>
        <select id="pattern" name="pattern">
          <option value="single">Tek Delik</option>
          <option value="triple">Üçlü Delik (5 aşağı, 7 yukarı)</option>
        </select>
        <button type="submit">Hesapla</button>
      </form>
      <p id="error" role="alert" hidden></p>
      <div id="result" aria-live="polite" hidden>
        <div class="summary" id="summary"></div>
        <div id="rows"></div>
      </div>
    </section>
    <section class="card panel" id="cabinet-panel" hidden>
      <form id="cabinet-calculator">
        <label for="cabinet-type">Dolap türü</label>
        <select id="cabinet-type" name="cabinet-type">
          <option value="base">Alt dolap</option>
          <option value="upper">Üst dolap</option>
        </select>
        <label for="cabinet-width">Genişlik (cm)</label>
        <input id="cabinet-width" name="cabinet-width" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Örnek: 60" required>
        <label for="cabinet-height">Yükseklik (cm)</label>
        <input id="cabinet-height" name="cabinet-height" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Örnek: 72" required>
        <label for="cabinet-depth">Derinlik (cm)</label>
        <input id="cabinet-depth" name="cabinet-depth" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Örnek: 56" required>
        <label for="cabinet-thickness">Panel kalınlığı (cm)</label>
        <input id="cabinet-thickness" name="cabinet-thickness" type="number" min="0.01" step="0.01" inputmode="decimal" value="1.90" required>
        <label for="cabinet-shelves">Raf sayısı</label>
        <input id="cabinet-shelves" name="cabinet-shelves" type="number" min="0" step="1" inputmode="numeric" value="1" required>
        <label for="cabinet-quantity">Dolap adedi</label>
        <input id="cabinet-quantity" name="cabinet-quantity" type="number" min="1" step="1" inputmode="numeric" value="1" required>
        <button type="submit">Kesim listesini çıkar</button>
      </form>
      <p id="cabinet-error" role="alert" hidden></p>
      <div id="cabinet-result" aria-live="polite" hidden>
        <p class="rule" id="cabinet-rule"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Parça</th><th>Adet</th><th>Boy × En</th><th>Ön bant</th></tr></thead>
            <tbody id="cut-rows"></tbody>
          </table>
        </div>
        <div class="band-total" id="band-total"></div>
        <p class="muted">Ölçüler cm’dir. Bant hesabı yalnız parçaların ön kenarları içindir.</p>
        <div class="sheet-settings">
          <h2>Yatar testere yerleşimi</h2>
          <p class="muted">Parçaları baştan sona düz kesim yapılabilen şeritlere yerleştirir.</p>
          <div class="sheet-grid">
            <div>
              <label for="sheet-length">Tabaka boyu (cm)</label>
              <input id="sheet-length" type="number" min="1" step="0.1" inputmode="decimal" value="280">
            </div>
            <div>
              <label for="sheet-width">Tabaka eni (cm)</label>
              <input id="sheet-width" type="number" min="1" step="0.1" inputmode="decimal" value="207">
            </div>
            <div>
              <label for="kerf">Testere payı (cm)</label>
              <input id="kerf" type="number" min="0" step="0.1" inputmode="decimal" value="0.4">
            </div>
          </div>
          <label class="check-row" for="allow-rotation">
            <input id="allow-rotation" type="checkbox">
            Parçalar 90° döndürülebilir
          </label>
          <button type="button" id="optimize-button">Yatar testereye yerleştir</button>
          <p id="sheet-error" role="alert" hidden></p>
          <div id="sheet-result" hidden>
            <div class="sheet-summary" id="sheet-summary"></div>
            <div id="sheets"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const holeForm = document.querySelector('#hole-calculator');
    const errorBox = document.querySelector('#error');
    const result = document.querySelector('#result');
    const summary = document.querySelector('#summary');
    const rows = document.querySelector('#rows');
    const format = (value) => value.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((item) => item.classList.toggle('active', item === tab));
        document.querySelectorAll('.panel').forEach((panel) => { panel.hidden = panel.id !== tab.dataset.panel; });
      });
    });

    holeForm.addEventListener('submit', (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      result.hidden = true;
      const data = new FormData(holeForm);
      const height = Number(String(data.get('height')).replace(',', '.'));
      const shelfCount = Number(data.get('shelves'));
      const thickness = Number(String(data.get('thickness')).replace(',', '.'));
      const pattern = data.get('pattern');

      if (!Number.isFinite(height) || height <= 0 || !Number.isInteger(shelfCount) || shelfCount <= 0 ||
          !Number.isFinite(thickness) || thickness <= 0) {
        errorBox.textContent = 'Lütfen bütün ölçüleri doğru gir.';
        errorBox.hidden = false;
        return;
      }

      const clearGap = (height - shelfCount * thickness) / (shelfCount + 1);
      if (clearGap <= 0) {
        errorBox.textContent = 'Raflar bu yüksekliğe sığmıyor.';
        errorBox.hidden = false;
        return;
      }

      summary.textContent = `Net boşluk: ${format(clearGap)} cm`;
      rows.replaceChildren();
      for (let index = 0; index < shelfCount; index += 1) {
        const shelfNumber = index + 1;
        const centre = shelfNumber * clearGap + index * thickness;
        const row = document.createElement('div');
        row.className = 'row';
        const badge = document.createElement('div');
        badge.className = 'badge';
        badge.textContent = String(shelfNumber);
        const measure = document.createElement('div');
        measure.className = 'measure';
        if (pattern === 'triple') {
          measure.innerHTML = `Alt: <strong>${format(centre - 5)} cm</strong><br>Orta: <strong>${format(centre)} cm</strong><br>Üst: <strong>${format(centre + 7)} cm</strong>`;
        } else {
          measure.innerHTML = `Delik merkezi: <strong>${format(centre)} cm</strong>`;
        }
        row.append(badge, measure);
        rows.append(row);
      }
      const note = document.createElement('p');
      note.className = 'muted';
      note.textContent = 'Bütün ölçüler zeminden alınır.';
      rows.append(note);
      result.hidden = false;
    });

    const cabinetForm = document.querySelector('#cabinet-calculator');
    const cabinetError = document.querySelector('#cabinet-error');
    const cabinetResult = document.querySelector('#cabinet-result');
    const cabinetRule = document.querySelector('#cabinet-rule');
    const cutRows = document.querySelector('#cut-rows');
    const bandTotal = document.querySelector('#band-total');
    let currentCutParts = [];

    cabinetForm.addEventListener('submit', (event) => {
      event.preventDefault();
      cabinetError.hidden = true;
      cabinetResult.hidden = true;
      const data = new FormData(cabinetForm);
      const type = data.get('cabinet-type');
      const width = Number(data.get('cabinet-width'));
      const height = Number(data.get('cabinet-height'));
      const depth = Number(data.get('cabinet-depth'));
      const thickness = Number(data.get('cabinet-thickness'));
      const shelfCount = Number(data.get('cabinet-shelves'));
      const cabinetQuantity = Number(data.get('cabinet-quantity'));

      if (![width, height, depth, thickness].every((value) => Number.isFinite(value) && value > 0) ||
          !Number.isInteger(shelfCount) || shelfCount < 0 ||
          !Number.isInteger(cabinetQuantity) || cabinetQuantity < 1) {
        cabinetError.textContent = 'Lütfen bütün ölçüleri ve adetleri doğru gir.';
        cabinetError.hidden = false;
        return;
      }

      const innerWidth = width - 2 * thickness;
      const sideHeight = type === 'base' ? height - thickness : height;
      if (innerWidth <= 0 || sideHeight <= 0) {
        cabinetError.textContent = 'Panel kalınlığı dolap ölçülerine göre fazla.';
        cabinetError.hidden = false;
        return;
      }

      const parts = type === 'base'
        ? [
            { name: 'Yan', quantity: 2, length: sideHeight, width: depth },
            { name: 'Alt', quantity: 1, length: width, width: depth },
            { name: 'Üst', quantity: 1, length: innerWidth, width: depth },
            { name: 'Raf', quantity: shelfCount, length: innerWidth, width: depth },
          ]
        : [
            { name: 'Yan', quantity: 2, length: height, width: depth },
            { name: 'Alt / Üst', quantity: 2, length: innerWidth, width: depth },
            { name: 'Raf', quantity: shelfCount, length: innerWidth, width: depth },
          ];

      cutRows.replaceChildren();
      let totalBandCm = 0;
      parts.filter((part) => part.quantity > 0).forEach((part) => {
        const quantity = part.quantity * cabinetQuantity;
        const bandCm = part.length * quantity;
        totalBandCm += bandCm;
        const row = document.createElement('tr');
        [part.name, String(quantity), `${format(part.length)} × ${format(part.width)}`, `${format(bandCm)} cm`]
          .forEach((value) => {
            const cell = document.createElement('td');
            cell.textContent = value;
            row.append(cell);
          });
        cutRows.append(row);
      });

      cabinetRule.textContent = type === 'base'
        ? 'Alt dolap: alt tam boy; yanlar bir panel kısa; üst ve raflar yanların arasında.'
        : 'Üst dolap: yanlar tam boy; alt, üst ve raflar yanların arasında.';
      const bandMetres = totalBandCm / 100;
      bandTotal.innerHTML = `Toplam ön kenar bandı: <strong>${format(bandMetres)} m</strong><br>%10 fireli: <strong>${format(bandMetres * 1.1)} m</strong>`;
      currentCutParts = parts
        .filter((part) => part.quantity > 0)
        .map((part) => ({ ...part, quantity: part.quantity * cabinetQuantity }));
      sheetResult.hidden = true;
      cabinetResult.hidden = false;
    });

    const optimizeButton = document.querySelector('#optimize-button');
    const sheetError = document.querySelector('#sheet-error');
    const sheetResult = document.querySelector('#sheet-result');
    const sheetSummary = document.querySelector('#sheet-summary');
    const sheetsContainer = document.querySelector('#sheets');

    function splitGuillotineSpace(free, placement) {
      const rightWidth = free.width - placement.packedWidth;
      const bottomHeight = free.height - placement.packedHeight;
      const next = [];
      if (placement.splitDirection === 'vertical') {
        if (rightWidth > 0.01) {
          next.push({ x: free.x + placement.packedWidth, y: free.y, width: rightWidth, height: free.height });
        }
        if (bottomHeight > 0.01) {
          next.push({ x: free.x, y: free.y + placement.packedHeight, width: placement.length, height: bottomHeight });
        }
      } else {
        if (bottomHeight > 0.01) {
          next.push({ x: free.x, y: free.y + placement.packedHeight, width: free.width, height: bottomHeight });
        }
        if (rightWidth > 0.01) {
          next.push({ x: free.x + placement.packedWidth, y: free.y, width: rightWidth, height: placement.width });
        }
      }
      return next;
    }

    function findBestPlacement(sheetList, piece, sheetLength, sheetWidth, kerf, allowRotation) {
      let best = null;
      const orientations = [{ length: piece.length, width: piece.width, rotated: false }];
      if (allowRotation && Math.abs(piece.length - piece.width) > 0.01) {
        orientations.push({ length: piece.width, width: piece.length, rotated: true });
      }
      sheetList.forEach((sheet, sheetIndex) => {
        sheet.free.forEach((free, freeIndex) => {
          orientations.forEach((orientation) => {
            const packedWidth = orientation.length + (orientation.length < free.width - 0.001 ? kerf : 0);
            const packedHeight = orientation.width + (orientation.width < free.height - 0.001 ? kerf : 0);
            if (packedWidth <= free.width + 0.001 && packedHeight <= free.height + 0.001) {
              const remainingWidth = free.width - packedWidth;
              const remainingHeight = free.height - packedHeight;
              const shortSide = Math.min(remainingWidth, remainingHeight);
              const longSide = Math.max(remainingWidth, remainingHeight);
              const score = shortSide * 10000 + longSide;
              if (!best || score < best.score) {
                const splitDirection = remainingWidth > remainingHeight ? 'vertical' : 'horizontal';
                best = { sheetIndex, freeIndex, score, packedWidth, packedHeight, splitDirection, ...orientation };
              }
            }
          });
        });
      });
      return best;
    }

    optimizeButton.addEventListener('click', () => {
      sheetError.hidden = true;
      sheetResult.hidden = true;
      const sheetLength = Number(document.querySelector('#sheet-length').value);
      const sheetWidth = Number(document.querySelector('#sheet-width').value);
      const kerf = Number(document.querySelector('#kerf').value);
      const allowRotation = document.querySelector('#allow-rotation').checked;

      if (!currentCutParts.length) {
        sheetError.textContent = 'Önce kesim listesini çıkar.';
        sheetError.hidden = false;
        return;
      }
      if (![sheetLength, sheetWidth].every((value) => Number.isFinite(value) && value > 0) ||
          !Number.isFinite(kerf) || kerf < 0) {
        sheetError.textContent = 'Tabaka ve testere payı ölçülerini doğru gir.';
        sheetError.hidden = false;
        return;
      }

      const pieces = currentCutParts.flatMap((part) =>
        Array.from({ length: part.quantity }, (_, index) => ({
          name: `${part.name} ${index + 1}`,
          length: part.length,
          width: part.width,
          area: part.length * part.width,
        }))
      ).sort((a, b) => b.area - a.area);

      const sheetList = [];
      for (const piece of pieces) {
        const fitsNormal = piece.length <= sheetLength && piece.width <= sheetWidth;
        const fitsRotated = allowRotation && piece.width <= sheetLength && piece.length <= sheetWidth;
        if (!fitsNormal && !fitsRotated) {
          sheetError.textContent = `${piece.name} (${format(piece.length)} × ${format(piece.width)} cm) tabakaya sığmıyor.`;
          sheetError.hidden = false;
          return;
        }

        if (!sheetList.length) {
          sheetList.push({ free: [{ x: 0, y: 0, width: sheetLength, height: sheetWidth }], pieces: [] });
        }
        let placement = findBestPlacement(sheetList, piece, sheetLength, sheetWidth, kerf, allowRotation);
        if (!placement) {
          sheetList.push({ free: [{ x: 0, y: 0, width: sheetLength, height: sheetWidth }], pieces: [] });
          placement = findBestPlacement(sheetList, piece, sheetLength, sheetWidth, kerf, allowRotation);
        }
        const sheet = sheetList[placement.sheetIndex];
        const free = sheet.free[placement.freeIndex];
        sheet.pieces.push({
          ...piece,
          x: free.x,
          y: free.y,
          displayLength: placement.length,
          displayWidth: placement.width,
          rotated: placement.rotated,
        });
        const nextFree = splitGuillotineSpace(free, placement);
        sheet.free.splice(placement.freeIndex, 1, ...nextFree);
      }

      const totalPartArea = pieces.reduce((total, piece) => total + piece.area, 0);
      const efficiency = totalPartArea / (sheetList.length * sheetLength * sheetWidth) * 100;
      sheetSummary.innerHTML = `Gerekli tabaka: <strong>${sheetList.length}</strong><br>Malzeme kullanım oranı: <strong>%${format(efficiency)}</strong><br>Kesim tipi: <strong>Yatar testere — tam boy düz kesim</strong>`;
      sheetsContainer.replaceChildren();
      sheetList.forEach((sheet, index) => {
        const card = document.createElement('div');
        card.className = 'sheet-card';
        const title = document.createElement('h3');
        title.className = 'sheet-title';
        title.textContent = `Tabaka ${index + 1} — ${format(sheetLength)} × ${format(sheetWidth)} cm`;
        const board = document.createElement('div');
        board.className = 'sheet';
        board.style.aspectRatio = `${sheetLength} / ${sheetWidth}`;
        sheet.pieces.forEach((piece) => {
          const element = document.createElement('div');
          element.className = 'piece';
          element.style.left = `${piece.x / sheetLength * 100}%`;
          element.style.top = `${piece.y / sheetWidth * 100}%`;
          element.style.width = `${piece.displayLength / sheetLength * 100}%`;
          element.style.height = `${piece.displayWidth / sheetWidth * 100}%`;
          element.setAttribute('aria-label', `${piece.name}, ${format(piece.displayLength)} × ${format(piece.displayWidth)} santimetre`);
          const name = document.createElement('span');
          name.className = 'piece-name';
          name.textContent = piece.name;
          const lengthLabel = document.createElement('span');
          lengthLabel.className = 'edge-label edge-top';
          lengthLabel.textContent = `${format(piece.displayLength)} cm`;
          const widthLabel = document.createElement('span');
          widthLabel.className = 'edge-label edge-side';
          widthLabel.textContent = `${format(piece.displayWidth)} cm`;
          element.append(name, lengthLabel, widthLabel);
          board.append(element);
        });
        card.append(title, board);
        sheetsContainer.append(card);
      });
      sheetResult.hidden = false;
    });
  </script>
</body>
</html>
